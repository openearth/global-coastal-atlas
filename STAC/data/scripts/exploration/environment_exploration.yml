# Environment for the notebooks in STAC/data/scripts/exploration/
# (17_seabed_litho_check.ipynb and 18_hydrolakes_check.ipynb)
#
# Install with miniforge (mamba) or conda:
#   mamba env create -f environment_exploration.yml
#   conda activate gca-exploration
#
# Then register the kernel for Jupyter (optional, if not already available):
#   python -m ipykernel install --user --name gca-exploration
name: gca-exploration
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - matplotlib
  - rasterio
  - geopandas>=1.0
  - pyogrio
  - pyarrow
  - fsspec
  - aiohttp
  - requests
  - pystac
  - pystac-client
  - jupyterlab
  - ipykernel
